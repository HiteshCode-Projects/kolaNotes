<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.products{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
                           /* repeat(No of Column - 12Maxmium No of Column  , Size of Column) */
    gap: 20px;
    background-color: aqua;
    padding: 30px;

                        } 

.box{
    background-color: peru;
    text-align: center;
    border: 1px solid white;  
    padding: 20px;  
}
    </style>
</head>
<body>
    <div class="products">
      
        <div class="box">Cake</div>
        <div class="box">Cookies</div>
        <div class="box">Pastry</div>
        <div class="box">Biscuits</div>
        <div class="box">Bread</div>
        <div class="box">CheeseCake</div>
       



    </div>




</body>
</html>
