<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Operators - It allows us to do action

        //1.Arthmetic Operators - +, -, / , * , %

        console.log(10+5)
        console.log(10-5)
        console.log(10*5)
        console.log(10/5)

        // % - It Gives Remainder As Ouput
        console.log(11 % 2)  //1
        console.log(2 % 11)  // left num < right num = left num so 2 is the output
        console.log(1%9)  //1

        //2.Assigment Oper 
        // = equal to assign value

        let count = 10
        console.log(count += 5)

        console.log(count)

        //3. comaprison Opem

        // == Compares only value
        console.log(5 == "5")

        //=== Compares value and Data type
        console.log(5 === "5")

        console.log(10 > 5)
        console.log(10 < 5)

        console.log(10 >= 10)
        console.log(10<=10)

    </script>
</body>
</html>
