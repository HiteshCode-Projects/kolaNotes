        //Multiple Data

        //1. ARRAY : Multiple Data of Diffrent Data Types in Js
        // Symbol -  [ ] square bracket

        var passengers = [ "John" , "Mike" , "Bob" , 1101 , true    ]
        console.log(passengers)

        //Access The Data through Index No
        // ARRAYNAME[Index No]

        console.log(passengers[2])
        console.log(passengers[3])
        console.log(passengers[5])
