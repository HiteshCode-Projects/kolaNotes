<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.products{
   display: grid;


   /* grid-template-columns: repeat(No of Column , Size of Column);  Maximum You can make 12 column*/
   grid-template-columns: repeat( 12, 1fr);
   gap: 20px;



    background-color: aqua;
    padding: 20px;
}

.box{
    background-color: peru;
    text-align: center;
    border: 1px solid white;  
    padding: 20px;  
}
    </style>
</head>
<body>
    <div class="products">
      
        <div class="box">Cake</div>
        <div class="box">Cookies</div>
        <div class="box">Pastry</div>
        <div class="box">Biscuits</div>
        <div class="box">Bread</div>
        <div class="box">CheeseCake</div>
       



    </div>




</body>
</html>
