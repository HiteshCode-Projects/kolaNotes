<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<body>
    <script>
      //Loop - Doing the same Task again and again - repeating the task
      //GOLDEN RULE : When CONDITION IS TRUE - Loop Starts . When Conditon is False - Loop Stops

      //1.for(start point ; ending/condition point; operations ++ or --)

      //print number  1 to 10 in console 

      for( let i = 1;  i <= 10; i++){
        //Task
        console.log(i)
      }
       // Trick - WHEN YOU KNOW THE START POINT AND END POINT - for loop


      //2.while(Condtion) loop
      //GOLDEN RULE : When CONDITION IS TRUE - Loop Starts . When Conditon is False - Loop Stops
        
      let count = 1

      while(count<=5){
        //Task
        console.log("Hello Kola")
        count++

      }


      //3. do { } while(condition)

      let num = 7

      do{
        console.log("Good evening")
        
      }while(num < 5)





    </script>

</body>
</html>
