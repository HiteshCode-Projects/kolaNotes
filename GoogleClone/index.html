<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        .container{
            text-align: center;
          
        }

        .logo{
            font-size: 80px;
            color: #4285f4;
            margin-bottom: 30px;
        }

        .seach-box input{
            width: 600px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            
        }

        .shorcuts{
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
        }

        .icon{
            
            background-color: #f1f3f4;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }

        .card p{
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
                  
        <!-- Google Logo -->
         <h1 class="logo">Google</h1>

         <!-- Search Box -->
          <div class="seach-box">
            <input placeholder="search Google">
          </div>

          <div class="shorcuts">

          <div class="card">
            <div class="icon">%</div>
            <p>Unlox</p>
          </div>

          <div class="card">
            <div class="icon">🌐</div>
            <p>Webstore</p>
          </div>

          <div class="card">
            <div class="icon">+</div>
            <p>Add Shortcut</p>
          </div>
 </div>



    </div>
</body>
</html>
