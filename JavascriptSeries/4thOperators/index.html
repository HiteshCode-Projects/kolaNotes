<body>
    <script>
        //Operators - Used To do Action on Data

        //1. Arthmetic : - , + , / , * , %

        console.log(10+5)
        console.log(10-5)
        console.log(10/5)
        console.log(10*5)

        //% Remainder
        console.log(13 % 2)  //1

        //2. Assignment Op : =
        let score = 2

        score += 1

        console.log(score)


        
    </script>
