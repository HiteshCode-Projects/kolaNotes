<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    // functions - Are used to do a Specific Task

    //Synatx -   function FunctionName(){
       Task Instruction

  //  }

  <script>
        function sayHello(){
            //Instruction - Task
            console.log("Hello User")

        }

        sayHello()   //Calling The Function


        //Function with parameter  (parameter - Act like Variable)
        function Greet(name){

            console.log("Welcome Back" , name)

        }

        Greet("Kola")
        Greet("john")
        Greet("Bob")

        Greet("Charlie")


        // Function with return : Keyword
        function Add(a,b){
            return   a + b;
        }
     console.log(Add(10,5))//15

     //Arrow Function : Short Form :   =>  Symbol

        let mul = (x,y)=> x * y 
       console.log(mul(2,4))
  </script>


</body>
</html>
